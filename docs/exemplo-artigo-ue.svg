<svg xmlns="http://www.w3.org/2000/svg" width="860" height="554" viewBox="0 0 860 554" role="img" aria-label="Exemplo de resposta do comando /artigo-ue RGPD 17: texto do artigo e bloco Fontes com ligação oficial">
<rect width="860" height="554" rx="10" fill="#0d1117"/><rect width="860" height="36" rx="10" fill="#161b22"/><rect y="26" width="860" height="10" fill="#161b22"/>
<circle cx="20" cy="18" r="6" fill="#ff5f56"/><circle cx="40" cy="18" r="6" fill="#ffbd2e"/><circle cx="60" cy="18" r="6" fill="#27c93f"/>
<text x="430.0" y="23" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#8b949e">legislacao-pt · resposta real, abreviada com […]</text>
<text x="24" y="64" xml:space="preserve" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" fill="#7ee787">&gt; /artigo-ue RGPD 17</text>
<text x="24" y="85" xml:space="preserve" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" fill="#8b949e">A consultar o repo de legislação da UE...</text>
<text x="24" y="106" xml:space="preserve" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" fill="#c9d1d9"></text>
<text x="24" y="127" xml:space="preserve" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" fill="#e6edf3" font-weight="bold">Artigo 17.º — Direito ao apagamento dos dados («direito a ser esquecido»)</text>
<text x="24" y="148" xml:space="preserve" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" fill="#c9d1d9"></text>
<text x="24" y="169" xml:space="preserve" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" fill="#c9d1d9">1. O titular tem o direito de obter do responsável pelo tratamento o apagamento dos seus</text>
<text x="24" y="190" xml:space="preserve" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" fill="#c9d1d9">dados pessoais, sem demora injustificada, e este tem a obrigação de apagar os dados</text>
<text x="24" y="211" xml:space="preserve" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" fill="#c9d1d9">pessoais, sem demora injustificada, quando se aplique um dos seguintes motivos:</text>
<text x="24" y="232" xml:space="preserve" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" fill="#c9d1d9"></text>
<text x="24" y="253" xml:space="preserve" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" fill="#c9d1d9">a) Os dados pessoais deixaram de ser necessários para a finalidade que motivou a sua</text>
<text x="24" y="274" xml:space="preserve" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" fill="#c9d1d9">recolha ou tratamento;</text>
<text x="24" y="295" xml:space="preserve" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" fill="#8b949e">[…]</text>
<text x="24" y="316" xml:space="preserve" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" fill="#c9d1d9"></text>
<text x="24" y="337" xml:space="preserve" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" fill="#e6edf3" font-weight="bold">Fontes:</text>
<text x="24" y="358" xml:space="preserve" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" fill="#c9d1d9">- Regulamento (UE) 2016/679 do Parlamento Europeu e do Conselho, de 27 de abril de 2016 […]</text>
<text x="24" y="379" xml:space="preserve" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" fill="#c9d1d9">  (Regulamento Geral sobre a Proteção de Dados)</text>
<text x="24" y="400" xml:space="preserve" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" fill="#79c0ff">  id: regulamento-ue-2016-679</text>
<text x="24" y="421" xml:space="preserve" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" fill="#79c0ff">  ficheiro: regulamentos/2016/regulamento-ue-2016-679/…-capitulo-i-a-capitulo-iii.md</text>
<text x="24" y="442" xml:space="preserve" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" fill="#79c0ff">  artigo: 17.º | estado: em vigor | versão consolidada: 2016-05-04</text>
<text x="24" y="463" xml:space="preserve" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" fill="#79c0ff">  oficial: https://eur-lex.europa.eu/legal-content/PT/TXT/?uri=CELEX:02016R0679-20160504</text>
<text x="24" y="484" xml:space="preserve" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" fill="#8b949e">Texto sem valor legal: só o Jornal Oficial da União Europeia faz fé. Confirma no EUR-Lex</text>
<text x="24" y="505" xml:space="preserve" font-family="ui-monospace,Consolas,Menlo,monospace" font-size="14" fill="#8b949e">antes de o usares. Não substitui aconselhamento jurídico.</text>
</svg>